name: CI for PR

on: 
  push: 
    branches: [ develop ]
  pull_request: 
    branches: [ develop ]
jobs:
 pipeline: 
  runs-on: ubuntu-latest
  strategy:
    matrix:
      node-version: [ 22.x ]

  steps:
    - uses: actions/checkout@v2
    - name: Staring Node.js ${{ matrix.node-version }}
      uses: actions/setup-node@v1
      with:
        node-version: ${{ matrix.node-version }}

    - name: install modules
      run: npm install
    - name: build production
      run: npm run build
    - name: linting
      run: npm run lint
      if: always()